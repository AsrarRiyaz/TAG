<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ayaan Gamer - Free Fire Exam</title>
    <!-- Brand Logo / Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-hover: #e68a00;
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-question: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #cc0000;
            --success: #00ff00;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-top: 6px solid var(--primary); 
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .brand-logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(255, 153, 0, 0.3);
        }

        .tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 25px; 
        }

        .tab-btn { 
            flex: 1; 
            padding: 14px; 
            background: #333; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 1em;
            transition: background 0.3s;
        }

        .tab-btn.active { 
            background: var(--primary); 
            color: #000; 
        }

        #timer-box { 
            background: var(--danger); 
            color: #fff; 
            text-align: center; 
            padding: 12px; 
            font-size: 1.5em; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            position: sticky; 
            top: 10px; 
            z-index: 100; 
            box-shadow: 0 4px 15px rgba(204, 0, 0, 0.4);
            border: 2px solid #ff4d4d;
        }

        .header { 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #333; 
            padding-bottom: 15px; 
        }

        h1 { 
            color: var(--primary); 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-size: 2.2em;
        }
        
        .user-info { 
            background: #252525; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px solid #444; 
        }

        .input-field { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            margin-bottom: 15px; 
            background: #333; 
            border: 1px solid #555; 
            color: #fff; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1em;
        }

        .question-card { 
            background: var(--bg-question); 
            margin-bottom: 20px; 
            padding: 20px; 
            border-radius: 8px; 
            border-left: 4px solid var(--primary); 
        }

        .options-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-top: 12px; 
        }

        .option-label { 
            display: flex; 
            align-items: center; 
            padding: 12px 15px; 
            background: #333; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.2s;
        }

        .option-label:hover {
            background: #444;
        }

        input[type="radio"] { 
            margin-right: 12px; 
            accent-color: var(--primary); 
            transform: scale(1.3); 
        }

        button.action-btn { 
            width: 100%; 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 16px; 
            font-size: 1.2em; 
            font-weight: bold; 
            text-transform: uppercase; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.3s;
        }

        button.action-btn:hover:not(:disabled) { 
            background: var(--primary-hover); 
        }

        button.action-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        #loading { 
            text-align: center; 
            font-size: 1.4em; 
            color: var(--primary); 
            margin: 40px 0; 
        }

        #result-box, #search-result { 
            display: none; 
            margin-top: 20px; 
            padding: 30px; 
            background: #222; 
            border-radius: 10px; 
            text-align: center; 
            border: 2px solid var(--primary); 
        }

        .score-text { 
            font-size: 2.5em; 
            color: var(--success); 
            margin: 10px 0; 
            font-weight: bold;
        }

        .success-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="favicon.png" alt="Brand Logo" class="brand-logo" onerror="this.style.display='none'">
            </div>
            <h1>The Ayaan Gamer</h1>
            <p style="color: var(--text-muted); margin: 5px 0 0 0;">Free Fire Exam Portal</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('exam')" id="tab-exam">Take Exam</button>
            <button class="tab-btn" onclick="switchTab('check')" id="tab-check">Check Result</button>
        </div>

        <!-- EXAM SECTION -->
        <div id="exam-section">
            <div id="loading">⚡ Loading Portal...</div>

            <!-- STEP 1: Enter Details (Timer does NOT start yet) -->
            <div id="step-1-details" style="display: none;">
                <div class="user-info">
                    <h3 style="margin-top:0;">Step 1: Enter Student Details</h3>
                    <label>Full Name:</label>
                    <input type="text" id="student-name" class="input-field" placeholder="Enter full name" required>
                    
                    <label>WhatsApp Number (Used for Result checking):</label>
                    <input type="tel" id="student-phone" class="input-field" placeholder="Enter WhatsApp number" required>
                    
                    <button type="button" class="action-btn" onclick="beginExam()">Start Exam 🚀</button>
                    <p style="text-align:center; color:var(--text-muted); font-size:0.9em; margin-top:15px;">
                        Timer will begin as soon as you click Start.
                    </p>
                </div>
            </div>

            <!-- STEP 2: Questions & Timer (Hidden until Step 1 is done) -->
            <form id="step-2-quiz" style="display: none;">
                <div id="timer-box">⏱️ Time Remaining: <span id="time-display">10:00</span></div>
                
                <div id="quiz-container"></div>
                
                <button type="submit" id="submit-btn" class="action-btn">Submit Exam</button>
            </form>
        </div>

        <!-- CHECK RESULT SECTION -->
        <div id="check-section" style="display: none;">
            <div class="user-info">
                <h3 style="margin-top:0;">Find Your Exam Result</h3>
                <label>Enter Registered WhatsApp Number:</label>
                <input type="tel" id="search-phone" class="input-field" placeholder="e.g. 9876543210">
                <button type="button" class="action-btn" onclick="searchScore()">Search Score</button>
            </div>
            <div id="search-result"></div>
        </div>

        <!-- SUCCESS/RESULT SCREEN -->
        <div id="result-box">
            <div class="success-icon" id="result-icon">✅</div>
            <h2 id="status-title" style="color: var(--success); margin-top:0;">Exam Submitted Successfully!</h2>
            
            <div id="score-display" style="display: none;">
                <p class="score-text"><span id="score">0</span> / 100</p>
            </div>
            
            <p id="status-msg" style="color: #fff; font-size: 1.2em; line-height:1.5;"></p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6oP4B8m55vynHgKp4kQVnSyBPVINIh4dMCi650jvFg1z1k41VQS8LqaPcy2RM6dvVjg/exec";

        let quizData = [];
        let isReleasedGlobally = false;
        let timeLeft = 600; // 10 minutes in seconds
        let timerInterval;
        
        // Store user data
        let currentStudentName = "";
        let currentStudentPhone = "";

        // Tab Switching Logic
        function switchTab(tab) {
            document.getElementById('tab-exam').classList.remove('active');
            document.getElementById('tab-check').classList.remove('active');
            
            if(tab === 'exam') {
                document.getElementById('tab-exam').classList.add('active');
                document.getElementById('exam-section').style.display = 'block';
                document.getElementById('check-section').style.display = 'none';
                document.getElementById('result-box').style.display = 'none';
            } else {
                document.getElementById('tab-check').classList.add('active');
                document.getElementById('exam-section').style.display = 'none';
                document.getElementById('check-section').style.display = 'block';
                document.getElementById('result-box').style.display = 'none';
            }
        }

        // Fetch questions on load, but DO NOT start timer
        async function fetchQuestions() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (data.error) {
                    document.getElementById("loading").innerHTML = "❌ " + data.message;
                    return;
                }

                quizData = data.questions || [];
                isReleasedGlobally = data.released;
                
                // Hide loading, show Step 1 (Details form)
                document.getElementById("loading").style.display = "none";
                document.getElementById("step-1-details").style.display = "block";
                
            } catch (err) {
                document.getElementById("loading").innerHTML = "❌ <b>Failed to connect to server.</b><br><small>Check network connection or Apps Script URL.</small>";
            }
        }

        // Triggered when user clicks "Start Exam"
        function beginExam() {
            currentStudentName = document.getElementById("student-name").value.trim();
            currentStudentPhone = document.getElementById("student-phone").value.trim();

            if (!currentStudentName || !currentStudentPhone) {
                alert("Please enter both your Full Name and WhatsApp Number before starting.");
                return;
            }

            // Hide Details form, Show Quiz & Timer
            document.getElementById("step-1-details").style.display = "none";
            document.getElementById("step-2-quiz").style.display = "block";
            
            renderQuiz();
            startTimer();
        }

        // Generate Question UI
        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = "";

            if (quizData.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>No questions available. Please contact admin.</p>";
                return;
            }

            quizData.forEach((item, index) => {
                let html = `
                    <div class="question-card">
                        <div style="font-weight: bold; font-size: 1.15em;">${index + 1}. ${item.q}</div>
                        <div class="options-group">
                `;
                item.opts.forEach(opt => {
                    if (opt) {
                        html += `
                            <label class="option-label">
                                <input type="radio" name="${item.id}" value="${opt}" required>
                                ${opt}
                            </label>
                        `;
                    }
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        // Start Timer Countdown
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById("time-display").textContent = `${m}:${s < 10 ? '0' : ''}${s}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time is up! Submitting your exam automatically.");
                    submitExam();
                }
            }, 1000);
        }

        // Submit Logic (Fixes button sticking and adds Green Tick)
        async function submitExam() {
            clearInterval(timerInterval);
            
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting... Please Wait ⏳";

            // Calculate Score locally
            let score = 0;
            const formData = new FormData(document.getElementById("step-2-quiz"));
            const maxScore = quizData.length * 5;

            quizData.forEach(item => {
                if (formData.get(item.id) === item.a) score += 5;
            });

            const payload = {
                name: currentStudentName,
                phone: currentStudentPhone,
                score: score
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const resData = await res.json();

                // Handle Duplicate / Error
                if (resData.result === "error") {
                    showResultScreen("❌", "Submission Failed", resData.message, "var(--danger)");
                    // Re-enable button so user isn't stuck if it's a network glitch
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit Exam";
                    return;
                }

                // Handle Success
                let isReleased = resData.released !== undefined ? resData.released : isReleasedGlobally;
                
                if (isReleased) {
                    showResultScreen("✅", "Exam Results Released!", "BOOYAH! Your score has been published.", "var(--success)", score, maxScore);
                } else {
                    showResultScreen("✅", "Exam Submitted Successfully!", "🔒 Results are currently locked by Admin.<br>Come back later and use the 'Check Result' tab to view your score!", "var(--success)");
                }

            } catch(e) {
                // If Fetch fails entirely (network offline)
                showResultScreen("⚠️", "Network Error", "Failed to connect to the server. Check your connection and try again.", "var(--primary)");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Exam";
            }
        }

        // Helper to update Result Screen UI
        function showResultScreen(icon, title, message, color, score = null, maxScore = null) {
            document.getElementById("exam-section").style.display = "none";
            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "block";
            window.scrollTo(0, 0);

            document.getElementById("result-icon").innerText = icon;
            
            const titleEl = document.getElementById("status-title");
            titleEl.innerText = title;
            titleEl.style.color = color;
            
            document.getElementById("status-msg").innerHTML = message;

            const scoreDisplay = document.getElementById("score-display");
            if (score !== null && maxScore !== null) {
                scoreDisplay.style.display = "block";
                document.querySelector(".score-text").innerHTML = `<span id="score">${score}</span> / ${maxScore}`;
            } else {
                scoreDisplay.style.display = "none";
            }
        }

        // Search Result logic
        async function searchScore() {
            const phone = document.getElementById("search-phone").value.trim();
            const resultDiv = document.getElementById("search-result");
            
            if (!phone) {
                alert("Please enter your registered WhatsApp number!");
                return;
            }

            resultDiv.style.display = "block";
            resultDiv.innerHTML = "<p>Searching database...</p>";

            try {
                const response = await fetch(`${SCRIPT_URL}?action=checkScore&phone=${encodeURIComponent(phone)}`);
                const data = await response.json();

                if (!data.released) {
                    resultDiv.innerHTML = `<p style="color: #ff9900; font-size: 1.2em; margin:0;">${data.message}</p>`;
                } else if (data.found) {
                    const maxScore = quizData.length > 0 ? (quizData.length * 5) : 100;
                    resultDiv.innerHTML = `
                        <div style="background: #1a3a1a; padding: 20px; border-radius: 8px; border: 1px solid #00ff00;">
                            <img src="favicon.png" alt="Logo" style="width:50px; border-radius:50%; margin-bottom:10px;" onerror="this.style.display='none'">
                            <h3 style="margin-top:0;">Student: ${data.name}</h3>
                            <p class="score-text">${data.score} / ${maxScore}</p>
                            <p style="margin-bottom:0; color:#aaa;">Official Score Verified ✅</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: #ff4d4d; font-size: 1.2em; margin:0;">${data.message}</p>`;
                }
            } catch (e) {
                resultDiv.innerHTML = "<p style='color:red; margin:0;'>Error retrieving score. Please check your connection.</p>";
            }
        }

        // Prevent default form submission
        document.getElementById("step-2-quiz").addEventListener("submit", function(e) {
            e.preventDefault();
            submitExam();
        });

        // Initialize
        window.onload = fetchQuestions;
    </script>
</body>
</html>
